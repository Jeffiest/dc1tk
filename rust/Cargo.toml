[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
c2-disc = { path = "crates/c2-disc" }
c2-script = { path = "crates/c2-script" }
c2-py = { path = "crates/c2-py" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"

[profile.release]
debug = 1
